name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-extra
      - run: pip install -e '.[test,emulate]'
      - run: python -m pytest -q          # integration tests are skipped: the stock firmware is not in the repo
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target base -t uc5300p-fwtool .
      - run: docker run --rm uc5300p-fwtool --version
